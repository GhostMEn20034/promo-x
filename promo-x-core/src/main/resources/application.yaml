spring:
  application:
    name: promo-x-core


  datasource:
    url: jdbc:postgresql://${SQL_HOST}/${SQL_DATABASE}
    username: ${SQL_USER}
    password: ${SQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: false

server:
  port: 8000