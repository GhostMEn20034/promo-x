spring:
  application:
    name: promo-x-core

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDP_ISSUER_URL}

  datasource:
    url: jdbc:postgresql://${SQL_HOST}/${SQL_DATABASE}?reWriteBatchedInserts=true
    username: ${SQL_USER}
    password: ${SQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Size for the database server, not this app: about (DB server cores * 2) + disks, shared by every app instance.
      maximum-pool-size: ${SQL_POOL_MAX_SIZE:10}
      # Defaults to the max size, a fixed-size pool as HikariCP recommends; lower it to close idle connections.
      minimum-idle: ${SQL_POOL_MIN_IDLE:${SQL_POOL_MAX_SIZE:10}}

  jpa:
    # Off, so a connection is returned when its transaction ends instead of being held until the response is sent.
    # Load what a response needs inside the transaction: lazy reads outside one fail.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
    redis:
      url: redis://:${REDIS_PASSWORD}@${REDIS_HOST}

  cache:
    type: redis

server:
  port: 8000

management:
  endpoint:
    health:
      show-details: when_authorized
      cache:
        time-to-live: "10s"

# Application-specific properties
promox:
  cache:
    ttls:
      promotion-rules: 1h
      products-with-categories: 1h
      promotion-usage-stats: 30m
    # How long the per-entry lock of @Cacheable(sync = true) lives in Redis; keep above the slowest value load
    lock-ttl: 30s
  promotion:
    # How long a reserved rule usage may wait to be confirmed (stored as the usage's expires_at)
    usage-reservation-ttl: 15m
