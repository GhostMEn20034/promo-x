spring:
  application:
    name: promo-x-core


  datasource:
    url: jdbc:postgresql://${SQL_HOST}/${SQL_DATABASE}?reWriteBatchedInserts=true
    username: ${SQL_USER}
    password: ${SQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
    redis:
      url: redis://:${REDIS_PASSWORD}@${REDIS_HOST}

  cache:
    type: redis

server:
  port: 8000

# Application-specific properties
promox:
  cache:
    ttls:
      promotion-rules: 1h
      products-with-categories: 1h