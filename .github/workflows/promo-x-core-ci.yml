name: promo-x-core CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every master commit is still tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # The workflow always runs so required checks never get stuck in "pending" on PRs that
  # don't touch promo-x-core; the jobs below are skipped instead, which counts as passing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'promo-x-core/**'
              - 'common-infra/ci/keycloak/**'
              - '.github/workflows/promo-x-core-ci.yml'

  smoke-test:
    name: Smoke test
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: promo-x-core

    # Throwaway values for the disposable CI containers; not real credentials.
    env:
      POSTGRES_PASSWORD: ci_postgres_password
      SQL_HOST: localhost:5432
      SQL_DATABASE: promox_ci
      SQL_USER: promox_ci
      SQL_PASSWORD: ci_sql_password
      REDIS_HOST: localhost:6379
      REDIS_PASSWORD: ci_redis_password
      # Realm and client come from common-infra/ci/keycloak/promo-x-ci-realm.json.
      IDP_ISSUER_URL: http://localhost:8080/realms/promo-x-ci
      KEYCLOAK_CLIENT_ID: promo-x-smoke-test
      KEYCLOAK_CLIENT_SECRET: ci-smoke-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # In-memory database: nothing to provision, and the realm is imported fresh on every run.
      # Started first and awaited after the build, so Keycloak boots while Maven runs.
      - name: Start Keycloak
        run: |
          docker run -d --name promox-keycloak \
            -p 8080:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci_keycloak_admin_password \
            -e KC_HEALTH_ENABLED=true \
            -v "$GITHUB_WORKSPACE/common-infra/ci/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.6 start-dev --db=dev-mem --import-realm

      # Same containers as local development; the compose file reads the env values above.
      - name: Start PostgreSQL and Redis
        run: |
          docker compose -f docker-compose-dev.yaml up -d

          for _ in $(seq 1 60); do
            # -h localhost: the init script's temporary server only listens on the Unix socket,
            # so a TCP connection succeeds only once the real server is up with the app user.
            if docker exec promox-psql-db psql -h localhost -U "$SQL_USER" -d "$SQL_DATABASE" -c 'SELECT 1' > /dev/null 2>&1 \
              && docker exec promox-redis-db redis-cli ping | grep -qE 'PONG|NOAUTH'; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::PostgreSQL or Redis did not become ready"
          docker compose -f docker-compose-dev.yaml logs
          exit 1

      # Flyway is disabled at runtime and Hibernate only validates the schema, so migrate first.
      - name: Apply database migrations
        run: ./mvnw -B -ntp flyway:migrate

      - name: Build application
        run: ./mvnw -B -ntp -DskipTests package

      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:9000/health/ready \
              && curl -sf -o /dev/null "$IDP_ISSUER_URL/.well-known/openid-configuration"; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Keycloak or the promo-x-ci realm did not become ready"
          docker logs promox-keycloak
          exit 1

      - name: Start application and check health
        run: |
          java -jar target/promox-core.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          fail() {
            echo "::error::$1"
            cat app.log
            exit 1
          }

          HEALTH_URL=http://localhost:8000/actuator/health

          # "000" = not listening yet; 503 = up, but a component (e.g. database or Redis) is DOWN.
          status=000
          for _ in $(seq 1 60); do
            kill -0 "$APP_PID" 2>/dev/null || fail "Application exited during startup"
            status=$(curl -s -o health.json -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Application is healthy: $(cat health.json)"
              exit 0
            fi
            sleep 2
          done

          fail "Health check did not return HTTP 200 within 120s (last status: $status, body: $(cat health.json 2>/dev/null))"

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: promo-x-core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Integration tests start PostgreSQL and Redis through Testcontainers (Docker is available on the runner).
      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: promo-x-core/target/surefire-reports/
          retention-days: 7
